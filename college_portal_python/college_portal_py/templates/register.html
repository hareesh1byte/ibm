{% extends "base.html" %}
{% block title %}Register — Apex College Portal{% endblock %}
{% block content %}
<div class="auth-page-wrapper" style="padding-top: 1rem;">
  <div class="auth-card-box">
    <div class="auth-card-header" style="text-align:center; margin-bottom: 1.5rem;">
      <span class="auth-brand-badge"><i class="fa-solid fa-user-plus"></i></span>
      <h2 class="auth-card-title">Create Account</h2>
      <p class="auth-card-subtitle">Register as a student to get started.</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label class="form-label">Full name</label>
        <input type="text" name="full_name" class="form-control" required>
      </div>

      <div class="form-row" style="display:flex; gap: 1rem;">
        <div class="form-group" style="flex:1;">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group" style="flex:1;">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="password123">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Role</label>
        <select name="role" class="form-control">
          <option value="student">Student</option>
          <option value="faculty">Faculty</option>
        </select>
      </div>

      <div class="form-row" style="display:flex; gap: 1rem;">
        <div class="form-group" style="flex:1;">
          <label class="form-label">Department</label>
          <input type="text" name="department" class="form-control" placeholder="Computer Science & Engineering">
        </div>
        <div class="form-group" style="flex:1;">
          <label class="form-label">Roll number (students)</label>
          <input type="text" name="roll_number" class="form-control" placeholder="Auto-generated if left blank">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top: 0.5rem;">Register</button>
    </form>

    <p style="text-align:center; margin-top: 1.2rem; font-size: 0.9rem;">
      Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
